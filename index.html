<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Untuk Teramia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #050510;
        }

        /* Screen transitions */
        .screen {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
        }

        .screen.hidden-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .screen.active-screen {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        /* Background for Screen 1 (Dark with stars) */
        #screen1 {
            background: radial-gradient(circle at center, #1a1025 0%, #050510 100%);
        }

        /* Background for Screen 2 (Soft aesthetic) */
        #screen2 {
            background: linear-gradient(135deg, #ffe6fa 0%, #ffcbe6 100%);
        }

        /* Neon Text Animation */
        .neon-container {
            display: flex;
            gap: 4px;
            margin-bottom: 3rem;
        }

        .neon-letter {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            opacity: 0;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff00de,
                0 0 40px #ff00de,
                0 0 80px #ff00de;
            animation: typeAndGlow 4s infinite;
        }

        /* Staggered animation delays for T-E-R-A-M-I-A */
        .neon-letter:nth-child(1) { animation-delay: 0.0s; }
        .neon-letter:nth-child(2) { animation-delay: 0.4s; }
        .neon-letter:nth-child(3) { animation-delay: 0.8s; }
        .neon-letter:nth-child(4) { animation-delay: 1.2s; }
        .neon-letter:nth-child(5) { animation-delay: 1.6s; }
        .neon-letter:nth-child(6) { animation-delay: 2.0s; }
        .neon-letter:nth-child(7) { animation-delay: 2.4s; }

        @keyframes typeAndGlow {
            0%, 10% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
            20%, 80% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            90%, 100% {
                opacity: 0;
                transform: translateY(-20px) scale(0.8);
            }
        }

        /* Button Styling */
        .btn-glow {
            background: linear-gradient(45deg, #ff00de, #00d4ff);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            border: none;
            box-shadow: 0 0 15px rgba(255, 0, 222, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-glow:active {
            transform: scale(0.95);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Flower Animations */
        .flower-container {
            width: 250px;
            height: 250px;
            position: relative;
            margin-bottom: 2rem;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .petal {
            transform-origin: bottom center;
            animation: bloom 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        /* Delay for petals */
        .petal-1 { animation-delay: 0.5s; transform: rotate(0deg); }
        .petal-2 { animation-delay: 0.7s; transform: rotate(45deg); }
        .petal-3 { animation-delay: 0.9s; transform: rotate(90deg); }
        .petal-4 { animation-delay: 1.1s; transform: rotate(135deg); }
        .petal-5 { animation-delay: 1.3s; transform: rotate(180deg); }
        .petal-6 { animation-delay: 1.5s; transform: rotate(225deg); }
        .petal-7 { animation-delay: 1.7s; transform: rotate(270deg); }
        .petal-8 { animation-delay: 1.9s; transform: rotate(315deg); }

        @keyframes bloom {
            0% { 
                opacity: 0; 
                transform: scale(0) rotate(var(--rot)); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(var(--rot)); 
            }
        }

        .center-flower {
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.2s forwards;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* Aesthetic Text */
        .aesthetic-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #d11a7b;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 1.5s ease 2.5s forwards;
        }

        .sub-text {
            font-size: 1.1rem;
            color: #8b3a6b;
            font-weight: 600;
            opacity: 0;
            animation: slideUpFade 1.5s ease 3s forwards;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Particle effects */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px #fff, 0 0 20px #ff00de; }
        }
    </style>
</head>
<body>

    <div id="screen1" class="screen active-screen z-10">
        <!-- Background Particles -->
        <div id="particles" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

        <div class="text-center px-4 flex flex-col items-center">
            <p class="text-gray-400 mb-2 font-medium tracking-widest text-sm">Hai,</p>
            
            <div class="neon-container">
                <span class="neon-letter">T</span>
                <span class="neon-letter">E</span>
                <span class="neon-letter">R</span>
                <span class="neon-letter">A</span>
                <span class="neon-letter">M</span>
                <span class="neon-letter">I</span>
                <span class="neon-letter">A</span>
            </div>

            <button onclick="openGift()" class="btn-glow text-white px-8 py-3 rounded-full font-bold text-lg cursor-pointer mt-8 flex items-center gap-2">
                Buka Sesuatu
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>

    <div id="screen2" class="screen hidden-screen z-20">
        <div class="text-center px-6 flex flex-col items-center">
            
            <!-- SVG Animated Flower -->
            <div class="flower-container">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-2xl">
                    <defs>
                        <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff1493;stop-opacity:1" />
                        </linearGradient>
                        <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    
                    <!-- Stem -->
                    <path d="M100 100 Q110 150 90 200" fill="none" stroke="#228b22" stroke-width="6" class="petal" style="--rot: 0deg; animation-delay: 0.2s;" />
                    <path d="M100 150 Q130 140 140 120" fill="none" stroke="#228b22" stroke-width="4" class="petal" style="--rot: 0deg; animation-delay: 0.4s;" />
                    <path d="M95 170 Q70 160 60 140" fill="none" stroke="#228b22" stroke-width="4" class="petal" style="--rot: 0deg; animation-delay: 0.6s;" />

                    <!-- Petals -->
                    <g transform="translate(100, 100)">
                        <path class="petal petal-1" style="--rot: 0deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-2" style="--rot: 45deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-3" style="--rot: 90deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-4" style="--rot: 135deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-5" style="--rot: 180deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-6" style="--rot: 225deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-7" style="--rot: 270deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        <path class="petal petal-8" style="--rot: 315deg;" d="M0,0 C-20,-40 -30,-70 0,-90 C30,-70 20,-40 0,0" fill="url(#petalGrad)" />
                        
                        <!-- Inner Petals -->
                        <path class="petal petal-1" style="--rot: 22.5deg;" d="M0,0 C-15,-30 -20,-50 0,-70 C20,-50 15,-30 0,0" fill="#ffb6c1" />
                        <path class="petal petal-3" style="--rot: 112.5deg;" d="M0,0 C-15,-30 -20,-50 0,-70 C20,-50 15,-30 0,0" fill="#ffb6c1" />
                        <path class="petal petal-5" style="--rot: 202.5deg;" d="M0,0 C-15,-30 -20,-50 0,-70 C20,-50 15,-30 0,0" fill="#ffb6c1" />
                        <path class="petal petal-7" style="--rot: 292.5deg;" d="M0,0 C-15,-30 -20,-50 0,-70 C20,-50 15,-30 0,0" fill="#ffb6c1" />
                    </g>

                    <!-- Center -->
                    <circle cx="100" cy="100" r="18" fill="url(#centerGrad)" class="center-flower" />
                    <circle cx="100" cy="100" r="14" fill="#ffd700" opacity="0.8" class="center-flower" />
                </svg>
            </div>

            <!-- Messages -->
            <h1 class="aesthetic-text mb-4">Bunga ini untukmu...</h1>
            <p class="sub-text mb-8">Semoga harimu selalu indah, bahagia terus, dan penuh dengan semangat ya! ✨</p>

            <button onclick="goBack()" class="px-6 py-2 bg-white/50 text-pink-700 font-semibold rounded-full shadow-sm hover:bg-white/80 transition-all text-sm opacity-0" style="animation: slideUpFade 1s ease 4s forwards;">
                Kembali
            </button>
        </div>
    </div>

    <script>
        // Function to transition from Screen 1 to Screen 2
        function openGift() {
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');
            
            screen1.classList.remove('active-screen');
            screen1.classList.add('hidden-screen');
            
            // Allow time for fade out before showing screen 2
            setTimeout(() => {
                screen2.classList.remove('hidden-screen');
                screen2.classList.add('active-screen');
            }, 800);
        }

        // Function to go back to Screen 1
        function goBack() {
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');
            
            screen2.classList.remove('active-screen');
            screen2.classList.add('hidden-screen');
            
            setTimeout(() => {
                screen1.classList.remove('hidden-screen');
                screen1.classList.add('active-screen');
            }, 800);
        }

        // Generate background stars/sparkles for Screen 1
        window.onload = () => {
            const container = document.getElementById('particles');
            const particleCount = 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('sparkle');
                
                // Random positions and sizes
                const size = Math.random() * 3 + 1; // 1px to 4px
                const x = Math.random() * 100; // 0% to 100%
                const y = Math.random() * 100;
                const duration = Math.random() * 3 + 2; // 2s to 5s
                const delay = Math.random() * 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}%`;
                particle.style.top = `${y}%`;
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.animationDelay = `${delay}s`;
                
                container.appendChild(particle);
            }
        };
    </script>
</body>
</html>
